name: Daily Intelligence Reports

on:
  # - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate reports
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO_DIR: ${{ github.workspace }}
        run: python generate_reports.py

      - name: Commit and push
        run: |
          git config user.name "Regent Intelligence Group"
          git config user.email "regentintelgroup@gmail.com"
          git add reports/ reports.json
          git diff --staged --quiet || git commit -m "Intelligence update $(date +'%B %d, %Y')"
          git push
