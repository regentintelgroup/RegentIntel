name: Update Reports Index

on:
  push:
    paths:
      - 'reports/**'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build reports.json from reports folder
        run: |
          python3 << 'EOF'
          import os, json, re

          reports_dir = "reports"
          entries = []

          for f in sorted(os.listdir(reports_dir), reverse=True):
              if not f.endswith(".html") or f.startswith("."):
                  continue

              try:
                  with open(os.path.join(reports_dir, f), "r") as fh:
                      content = fh.read()
              except:
                  continue

              # Extract title from <h1> or <title>
              title = ""
              h1 = re.search(r'<h1[^>]*>(.*?)</h1>', content, re.DOTALL)
              if h1:
                  title = re.sub(r'<[^>]+>', '', h1.group(1)).strip()

              if not title:
                  continue

              # Determine series
              if "SITREP-EF" in title or "Epic Fury" in title:
                  series = "EF"
              elif "SIGACT-HF" in title or "Homeland Focus" in title:
                  series = "HF"
              else:
                  series = "OTHER"

              # Extract report ID
              id_match = re.search(r'(SITREP-EF-\d+|SIGACT-HF-\d+)', title)
              report_id = id_match.group(1) if id_match else f.replace('.html', '')

              # Extract date from content
              date_iso = ""
              date_match = re.search(r'(\w+ \d{1,2}, \d{4})', content)
              if date_match:
                  try:
                      from datetime import datetime
                      dt = datetime.strptime(date_match.group(1), "%B %d, %Y")
                      date_iso = dt.strftime("%Y-%m-%d")
                  except:
                      date_iso = ""

              # Extract BLUF
              bluf = ""
              bluf_match = re.search(r'(?:BOTTOM LINE UP FRONT|BLUF)</div>\s*(?:<p>)?(.*?)(?:</p>|</div>)', content, re.DOTALL)
              if bluf_match:
                  bluf = re.sub(r'<[^>]+>', '', bluf_match.group(1)).strip()[:300]
              if not bluf:
                  bluf = "Assessment available in full report."

              entries.append({
                  "id": report_id,
                  "title": title,
                  "series": series,
                  "date": date_iso,
                  "bluf": bluf,
                  "filename": f,
                  "classification": "UNCLASSIFIED"
              })

          with open("reports.json", "w") as f:
              json.dump(entries, f, indent=2)

          print("Updated reports.json with {} entries".format(len(entries)))
          EOF

      - name: Commit updated index
        run: |
          git config user.name "Regent Intelligence Group"
          git config user.email "regentintelgroup@gmail.com"
          git add reports.json
          git diff --staged --quiet || git commit -m "Update reports index"
          git push
